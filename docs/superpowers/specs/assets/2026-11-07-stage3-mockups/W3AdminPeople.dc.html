<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리자 · 사람</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#A1A1A6}a:hover{color:#F2F2F0}
</style>
</helmet>
<div style="display: flex; min-height: 1080px; background: #0F0F10; color: #F2F2F0; font-family: 'Noto Sans KR', sans-serif">
<aside style="flex: 0 0 220px; border-right: 1px solid #2A2A2E; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 8px">
<img src="/_blob/976905e12f405266a67d8c882838e311" alt="영화대교" style="width: 120px; height: auto; display: block">
<span style="font-size: 12px; color: #8E8E93; letter-spacing: 0.2em">관리</span>
</div>
<nav style="display: flex; flex-direction: column; gap: 2px; font-size: 15px; font-weight: 500">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#{{n.key}}" style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.fw}}"><span>{{n.label}}</span><span style="font-size: 12px; font-weight: 700; color: #E0443B">{{n.badge}}</span></a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; padding: 0 12px">
<a href="#home" style="text-decoration: none; padding: 8px 0">예매 화면 열기 ↗</a>
<a href="#print" style="text-decoration: none; padding: 8px 0">발권기 열기 ↗</a>
</div>
</aside>
<main style="flex: 1 1 auto; min-width: 0; padding: 40px 0 80px 48px; display: flex; gap: 32px; align-items: flex-start">
<section style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em">사람</h1>
<p style="margin: 0; font-size: 14px; color: #8E8E93">한 번이라도 로그인했거나 명단에 넣은 사람 모두. 권한은 줄에서 바로, 이름·학번은 이름을 눌러 오른쪽에서 고쳐요.</p>
</div>
<button type="button" style="height: 44px; padding: 0 20px; background: #F2F2F0; border: 0; color: #0F0F10; font: inherit; font-size: 14px; font-weight: 700">사람 넣기</button>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" aria-pressed="{{c.pressed}}" style="height: 36px; padding: 0 14px; background: {{c.bg}}; border: 1px solid {{c.frame}}; border-radius: 18px; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 700">{{c.label}} <span style="font-weight: 400; color: {{c.sub}}">{{c.count}}</span></button>
</sc-for>
<label for="people-q" style="position: absolute; left: -9999px">이름, 학번, 이메일 찾기</label>
<input id="people-q" type="search" placeholder="이름 · 학번 · 이메일 찾기" style="margin-left: auto; width: 220px; height: 36px; box-sizing: border-box; padding: 0 14px; background: #18181A; border: 1px solid #2A2A2E; color: #F2F2F0; font: inherit; font-size: 13px">
</div>
<div style="display: flex; flex-direction: column; border-top: 1px solid #F2F2F0">
<div style="display: grid; grid-template-columns: 100px 64px minmax(0, 1fr) 236px; gap: 16px; padding: 10px 12px; font-size: 12px; color: #8E8E93; border-bottom: 1px solid #2A2A2E">
<span>이름</span><span>학번</span><span>이메일</span><span>누르면 바로 켜고 꺼져요</span>
</div>
<sc-for list="{{people}}" as="p" hint-placeholder-count="10">
<div style="display: grid; grid-template-columns: 100px 64px minmax(0, 1fr) 236px; gap: 16px; align-items: center; min-height: 52px; padding: 0 12px; background: {{p.bg}}; border-bottom: 1px solid #2A2A2E">
<button type="button" style="padding: 0; background: transparent; border: 0; color: #F2F2F0; font: inherit; font-size: 14px; font-weight: 700; text-align: left; text-decoration: underline; text-decoration-color: #3A3A3F; text-underline-offset: 4px">{{p.name}}</button>
<span style="font-size: 13px; color: #A1A1A6">{{p.sid}}</span>
<span style="font-size: 13px; color: #8E8E93; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.email}}</span>
<span style="display: flex; gap: 6px">
<sc-for list="{{p.toggles}}" as="t" hint-placeholder-count="3">
<button type="button" aria-pressed="{{t.pressed}}" style="height: 32px; padding: 0 10px; background: {{t.bg}}; border: 1px solid {{t.bd}}; color: {{t.fg}}; font: inherit; font-size: 12px; font-weight: 700; display: {{t.show}}">{{t.label}}</button>
</sc-for>
</span>
</div>
</sc-for>
</div>
</section>

<aside style="flex: 0 0 320px; align-self: stretch; border-left: 1px solid #2A2A2E; padding: 0 32px 0 28px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 4px">
<span style="font-size: 22px; font-weight: 900">이서연</span>
<span style="font-size: 13px; color: #8E8E93">ts250031@ts.hs.kr</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8E8E93">이름
<input type="text" value="이서연" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #18181A; border: 1px solid #2A2A2E; color: #F2F2F0; font: inherit; font-size: 14px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8E8E93">학번 <span style="color: #6E6E73">(교직원은 비워 두기)</span>
<input type="text" value="2208" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #18181A; border: 1px solid #2A2A2E; color: #F2F2F0; font: inherit; font-size: 14px">
</label>
</div>

<span style="font-size: 12px; color: #6E6E73">이름이나 학번은 고치고 칸을 벗어나면 저장돼요.</span>
<div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #2A2A2E; padding-top: 16px">
<button type="button" style="align-self: flex-start; height: 36px; padding: 0; background: transparent; border: 0; color: #E0443B; font: inherit; font-size: 13px; font-weight: 700">이 사람 차단하기</button>
<span style="font-size: 12px; line-height: 1.6; color: #6E6E73">차단하면 예매도, 초대 메일도 막혀요. 누르면 바로 차단되고 몇 초 동안 되돌릴 수 있어요.</span>
</div>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const nav = [['reservations', '예매', '대기 3'], ['movie', '상영', ''], ['mail', '메일', ''], ['people', '사람', ''], ['log', '기록', '']].map(([key, label, badge]) => {
const on = key === 'people';
return { key, label, badge, bg: on ? '#1E1E21' : 'transparent', fg: on ? '#F2F2F0' : '#A1A1A6', fw: on ? 700 : 500 };
});
const chips = [['전체', '[n]', true], ['예매 가능', '[n]', false], ['동아리원', '[n]', false], ['관리자', '[n]', false], ['예매 불가', '[n]', false], ['차단', '[n]', false]].map(([label, count, on]) => ({
label, count, pressed: on ? 'true' : 'false',
bg: on ? '#F2F2F0' : 'transparent', frame: on ? '#F2F2F0' : '#3A3A3F', fg: on ? '#0F0F10' : '#A1A1A6', sub: on ? '#4A4A50' : '#6E6E73'
}));
const rows = [
['김도윤', '2104', 'ts250012', ['book', 'club', 'admin']],
['이서연', '2208', 'ts250031', ['book', 'club']],
['박지호', '1312', 'ts260044', ['book']],
['최하은', '2115', 'ts250018', ['book', 'club']],
['정민재', '3102', 'ts240007', ['book']],
['강예린', '1201', 'ts260021', []],
['윤시우', '교직원', 'yoon.siwoo', ['book']],
['장서아', '3210', 'ts240033', ['block']],
['한지민', '1107', 'ts260009', ['book']],
['오태윤', '2301', 'ts250052', []]
];
const people = rows.map(([name, sid, id, has], i) => {
const blocked = has.includes('block');
const toggles = blocked
? [{ label: '차단됨 · 풀기', pressed: 'true', bg: 'transparent', bd: '#E0443B', fg: '#E0443B', show: 'inline-flex' }, { label: '', pressed: 'false', bg: '', bd: '', fg: '', show: 'none' }, { label: '', pressed: 'false', bg: '', bd: '', fg: '', show: 'none' }]
: [['book', '예매'], ['club', '동아리원'], ['admin', '관리자']].map(([k, label]) => {
const on = has.includes(k);
return { label, pressed: on ? 'true' : 'false', bg: on ? '#F2F2F0' : 'transparent', bd: on ? '#F2F2F0' : '#3A3A3F', fg: on ? '#0F0F10' : '#6E6E73', show: 'inline-flex' };
});
return { name, sid, email: id + '@ts.hs.kr', bg: i === 1 ? '#1E1E21' : 'transparent', toggles };
});
return { nav, chips, people };
}
}
</script>
</body>
</html>
