<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리자 · 상영</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#A1A1A6}a:hover{color:#F2F2F0}
</style>
</helmet>
<div style="display: flex; min-height: 1080px; background: #0F0F10; color: #F2F2F0; font-family: 'Noto Sans KR', sans-serif">
<aside style="flex: 0 0 220px; border-right: 1px solid #2A2A2E; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 8px">
<img src="/_blob/976905e12f405266a67d8c882838e311" alt="영화대교" style="width: 120px; height: auto; display: block">
<span style="font-size: 12px; color: #8E8E93; letter-spacing: 0.2em">관리</span>
</div>
<nav style="display: flex; flex-direction: column; gap: 2px; font-size: 15px; font-weight: 500">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#{{n.key}}" style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.fw}}"><span>{{n.label}}</span><span style="font-size: 12px; font-weight: 700; color: {{n.badgeFg}}">{{n.badge}}</span></a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; padding: 0 12px">
<a href="#home" style="text-decoration: none; padding: 8px 0">예매 화면 열기 ↗</a>
<a href="#print" style="text-decoration: none; padding: 8px 0">발권기 열기 ↗</a>
</div>
</aside>
<main style="flex: 1 1 auto; min-width: 0; padding: 40px 48px 120px; display: flex; flex-direction: column; gap: 40px; max-width: 980px; position: relative">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em">상영</h1>
<p style="margin: 0; font-size: 14px; color: #8E8E93">지금 예매받는 영화를 고칩니다. 다음 영화는 "새 회차 시작"으로 따로 만듭니다.</p>
</div>
<button type="button" style="height: 44px; padding: 0 20px; background: transparent; border: 1px solid #4A4A50; border-radius: 0; color: #F2F2F0; font: inherit; font-size: 14px; font-weight: 700">새 회차 시작</button>
</div>

<section style="display: flex; gap: 32px; align-items: flex-start">
<div style="flex: 0 0 168px; display: flex; flex-direction: column; gap: 10px">
<div style="width: 168px; height: 240px; background: #1A1A1C; border: 1px solid #2E2E32; display: flex; align-items: center; justify-content: center; color: #6E6E73; font-size: 13px">[포스터]</div>
<button type="button" style="height: 40px; background: transparent; border: 1px solid #2A2A2E; color: #F2F2F0; font: inherit; font-size: 13px; font-weight: 700">포스터 바꾸기</button>
<span style="font-size: 11px; line-height: 1.5; color: #6E6E73">이미지 파일이나 주소를 넣으면 알아서 저장해요.</span>
</div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #8E8E93">
<span style="display: block; width: 7px; height: 7px; border-radius: 4px; background: #E0443B"></span>
<span>이번 상영</span>
</div>
<div style="display: flex; flex-direction: column; border-top: 1px solid #F2F2F0">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
<label style="display: flex; align-items: center; gap: 20px; min-height: 52px; border-bottom: 1px solid #2A2A2E">
<span style="flex: 0 0 96px; font-size: 13px; color: #8E8E93">{{f.label}}</span>
<span style="flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 500; color: {{f.fg}}">{{f.value}}<span style="font-size: 12px; color: #6E6E73">{{f.hint}}</span></span>
</label>
</sc-for>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #F2F2F0; padding-bottom: 10px">
<h2 style="margin: 0; font-size: 18px; font-weight: 900">좌석 <span style="font-size: 13px; font-weight: 500; color: #8E8E93">· 중강당</span></h2>
<span style="font-size: 12px; color: #8E8E93">상영 장소를 바꾸면 여기도 따라 바뀝니다</span>
</div>
<div style="display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 12px; flex: 0 0 220px">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid #2A2A2E; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">동아리 전용 좌석 두기</span><span style="font-size: 12px; color: #8E8E93">끄면 이번 회차는 0석</span></span>
<input type="checkbox" role="switch" checked style="width: 20px; height: 20px; margin: 0; accent-color: #F2F2F0">
</label>
<span style="font-size: 13px; color: #A1A1A6">무엇을 지정할까요?</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<button type="button" aria-pressed="true" style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #F2F2F0; border: 1px solid #F2F2F0; color: #0F0F10; font: inherit; font-size: 14px; font-weight: 700; text-align: left"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #0F0F10; border-radius: 5px 5px 2px 2px"></span>동아리 전용 좌석</button>
<button type="button" style="height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: transparent; border: 1px solid #3A3A3F; color: #A1A1A6; font: inherit; font-size: 14px; font-weight: 700; text-align: left"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 1px dashed #8E8E93; border-radius: 5px 5px 2px 2px"></span>불편 좌석</button>
</div>
<span style="font-size: 12px; line-height: 1.6; color: #6E6E73">동아리 전용은 끌어서 네모로 잡아요. 불편 좌석은 하나씩 눌러 켜고 끄며, 예매하는 사람에게 경고만 띄워요.</span>
</div>
<div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0">
<div style="width: 70%; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 14px">
<span style="display: block; width: 100%; height: 3px; background: #8E8E93; border-radius: 2px"></span>
<span style="font-size: 11px; letter-spacing: 0.6em; color: #6E6E73; margin-left: 0.6em">스크린</span>
</div>
<sc-for list="{{seatRows}}" as="row" hint-placeholder-count="9">
<div style="display: flex; gap: 4px">
<sc-for list="{{row}}" as="s" hint-placeholder-count="14">
<span style="display: block; width: 28px; height: 28px; box-sizing: border-box; border-radius: 7px 7px 3px 3px; background: #1A1A1C; border: {{s.bd}}; margin-right: {{s.mr}}; visibility: {{s.vis}}"></span>
</sc-for>
</div>
</sc-for>
</div>
</div>
</section>

<section style="display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid #2A2A2E; padding-top: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 700">발권기 비밀번호</span>
<span style="font-size: 12px; color: #8E8E93">현장 발권기를 열 때 입력해요</span>
</div>
<button type="button" style="height: 40px; padding: 0 16px; background: transparent; border: 1px solid #3A3A3F; color: #F2F2F0; font: inherit; font-size: 13px; font-weight: 700">바꾸기</button>
</section>

<div style="position: absolute; left: 48px; right: 48px; bottom: 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px 14px 20px; background: #18181A; border: 1px solid #3A3A3F">
<span style="font-size: 14px; color: #A1A1A6"><b style="color: #F2F2F0">2곳</b> 바뀜 · 예매 마감, 동아리 전용 좌석</span>
<div style="display: flex; gap: 8px">
<button type="button" style="height: 44px; padding: 0 18px; background: transparent; border: 0; color: #A1A1A6; font: inherit; font-size: 14px; font-weight: 700">되돌리기</button>
<button type="button" style="height: 44px; padding: 0 28px; background: #F2F2F0; border: 0; color: #0F0F10; font: inherit; font-size: 14px; font-weight: 700">저장</button>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const nav = [['reservations', '예매', '대기 3'], ['movie', '상영', ''], ['mail', '메일', ''], ['people', '사람', ''], ['log', '기록', '']].map(([key, label, badge]) => {
const on = key === 'movie';
return { key, label, badge, bg: on ? '#1E1E21' : 'transparent', fg: on ? '#F2F2F0' : '#A1A1A6', fw: on ? 700 : 500, badgeFg: '#E0443B' };
});
const fields = [
{ label: '영화 제목', value: '[영화 제목]', hint: '', fg: '#F2F2F0' },
{ label: '상영 시작', value: '[11월 21일 (금) 오후 7:00]', hint: '달력', fg: '#F2F2F0' },
{ label: '끝나는 시간', value: '[오후 9:10]', hint: '', fg: '#F2F2F0' },
{ label: '상영 장소', value: '중강당', hint: '중강당 · 대강당', fg: '#F2F2F0' },
{ label: '관람 등급', value: '[12세 이상 관람가]', hint: '', fg: '#F2F2F0' },
{ label: '예매 마감', value: '[11월 20일 (목) 오후 10:00]', hint: '바뀜', fg: '#F2F2F0' }
];
const seatRows = Array.from({ length: 9 }, (_, r) => Array.from({ length: 14 }, (_, c) => {
const missing = c >= 7 && r * 7 + (c - 7) + 1 === 63;
let bd = '1px solid #3A3A3F';
if (r <= 2 && c >= 4 && c <= 9) bd = '2px solid #F2F2F0';
if ((r === 6 && c === 1) || (r === 8 && c === 12)) bd = '1px dashed #8E8E93';
return { bd, mr: c === 6 ? '20px' : '0px', vis: missing ? 'hidden' : 'visible' };
}));
return { nav, fields, seatRows };
}
}
</script>
</body>
</html>
