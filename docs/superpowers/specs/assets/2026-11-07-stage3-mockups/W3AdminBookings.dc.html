<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리자 · 예매</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#A1A1A6}a:hover{color:#F2F2F0}
</style>
</helmet>
<div style="display: flex; min-height: 1080px; background: #0F0F10; color: #F2F2F0; font-family: 'Noto Sans KR', sans-serif">
<aside style="flex: 0 0 220px; border-right: 1px solid #2A2A2E; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 8px">
<img src="/_blob/976905e12f405266a67d8c882838e311" alt="영화대교" style="width: 120px; height: auto; display: block">
<span style="font-size: 12px; color: #8E8E93; letter-spacing: 0.2em">관리</span>
</div>
<nav style="display: flex; flex-direction: column; gap: 2px; font-size: 15px; font-weight: 500">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#{{n.key}}" style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.fw}}"><span>{{n.label}}</span><span style="font-size: 12px; font-weight: 700; color: #E0443B">{{n.badge}}</span></a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; padding: 0 12px">
<a href="#home" style="text-decoration: none; padding: 8px 0">예매 화면 열기 ↗</a>
<a href="#print" style="text-decoration: none; padding: 8px 0">발권기 열기 ↗</a>
</div>
</aside>
<main style="flex: 1 1 auto; min-width: 0; padding: 40px 48px 80px; display: flex; flex-direction: column; gap: 40px">
<section style="min-width: 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em">예매</h1>
<p style="margin: 0; font-size: 14px; color: #8E8E93">「[영화 제목]」 · 예매 마감까지 [n일 n시간]</p>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #F2F2F0; border-bottom: 1px solid #2A2A2E">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<button type="button" aria-pressed="{{s.pressed}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 16px; background: {{s.bg}}; border: 0; border-left: 1px solid {{s.sep}}; color: #F2F2F0; font: inherit; text-align: left">
<span style="font-size: 12px; color: #8E8E93">{{s.label}}</span>
<span style="font-size: 28px; font-weight: 900; color: {{s.fg}}">{{s.value}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 13px; color: #A1A1A6">승인 대기가 맨 위에 와요. 위 숫자를 누르면 그것만 보여요.</span>
<label for="bk-q" style="position: absolute; left: -9999px">이름, 학번, 좌석 찾기</label>
<input id="bk-q" type="search" placeholder="이름 · 학번 · 좌석 찾기" style="width: 240px; height: 36px; box-sizing: border-box; padding: 0 14px; background: #18181A; border: 1px solid #2A2A2E; color: #F2F2F0; font: inherit; font-size: 13px">
</div>
<div style="display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 56px 120px minmax(160px, 1fr) 100px 64px 220px; gap: 12px; padding: 10px 12px; font-size: 12px; color: #8E8E93; border-bottom: 1px solid #2A2A2E">
<span>좌석</span><span>이름</span><span>팝콘</span><span style="white-space: nowrap">상태</span><span style="white-space: nowrap">발권</span><span></span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 56px 120px minmax(160px, 1fr) 100px 64px 220px; gap: 12px; align-items: center; min-height: 56px; padding: 0 12px; border-bottom: 1px solid #2A2A2E">
<span style="font-size: 17px; font-weight: 900">{{r.seat}}</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{r.name}}</span><span style="font-size: 12px; color: #8E8E93">{{r.sid}}</span></span>
<span style="font-size: 13px; color: #A1A1A6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.pop}}</span>
<span style="font-size: 13px; font-weight: 700; color: {{r.stFg}}; white-space: nowrap">{{r.st}}</span>
<span style="font-size: 13px; color: {{r.prFg}}; white-space: nowrap">{{r.pr}}</span>
<span style="display: flex; justify-content: flex-end; align-items: center; gap: 6px">
<button type="button" style="height: 36px; padding: 0 16px; background: #F2F2F0; border: 0; color: #0F0F10; font: inherit; font-size: 13px; font-weight: 700; white-space: nowrap; display: {{r.approve}}">승인</button>
<button type="button" style="height: 36px; padding: 0 12px; background: transparent; border: 1px solid #3A3A3F; color: #F2F2F0; font: inherit; font-size: 13px; font-weight: 700; white-space: nowrap; display: {{r.unprint}}">발권 되돌리기</button>
<button type="button" style="height: 36px; padding: 0 10px 0 14px; margin-left: 10px; background: transparent; border: 0; border-left: 1px solid #2A2A2E; color: #E0443B; font: inherit; font-size: 13px; font-weight: 700">취소</button>
</span>
</div>
</sc-for>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 12px; background: #18181A; border-bottom: 1px solid #2A2A2E">
<span style="font-size: 13px; color: #A1A1A6"><b style="color: #F2F2F0">A07 오태윤</b> 예매를 취소했어요. 취소 메일은 5초 뒤 나가요.</span>
<button type="button" style="height: 34px; padding: 0 14px; background: transparent; border: 1px solid #F2F2F0; color: #F2F2F0; font: inherit; font-size: 13px; font-weight: 700">되돌리기 · 4</button>
</div>
</div>
</section>

<aside style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; align-items: start">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 900; border-bottom: 1px solid #F2F2F0; padding-bottom: 8px">팝콘 <span style="font-size: 12px; font-weight: 500; color: #8E8E93">· 확정 기준</span></h2>
<div style="display: flex; flex-direction: column; font-size: 13px">
<span style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2A2A2E"><span style="color: #A1A1A6">오리지널</span><b>[n]</b></span>
<span style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2A2A2E"><span style="color: #A1A1A6">콘소메</span><b>[n]</b></span>
<span style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2A2A2E"><span style="color: #A1A1A6">카라멜</span><b>[n]</b></span>
<span style="display: flex; justify-content: space-between; padding: 10px 0"><span style="color: #A1A1A6">받을 돈</span><b style="font-size: 16px">[n]원</b></span>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 900; border-bottom: 1px solid #F2F2F0; padding-bottom: 8px">아직 예매 안 한 동아리원 <span style="font-size: 12px; font-weight: 500; color: #8E8E93">[n]명</span></h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{unbooked}}" as="u" hint-placeholder-count="5">
<span style="height: 28px; display: inline-flex; align-items: center; padding: 0 10px; border: 1px solid #2A2A2E; font-size: 12px; color: #A1A1A6">{{u}}</span>
</sc-for>
</div>
</section>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const nav = [['reservations', '예매', '대기 3'], ['movie', '상영', ''], ['mail', '메일', ''], ['people', '사람', ''], ['log', '기록', '']].map(([key, label, badge]) => {
const on = key === 'reservations';
return { key, label, badge, bg: on ? '#1E1E21' : 'transparent', fg: on ? '#F2F2F0' : '#A1A1A6', fw: on ? 700 : 500 };
});
const stats = [['승인 대기', '3', '#E0443B', false], ['확정', '[n]', '#F2F2F0', false], ['단체 확인 중', '[n]', '#F2F2F0', false], ['아직 발권 안 함', '[n]', '#F2F2F0', false]].map(([label, value, fg, on], i) => ({
label, value, fg, pressed: on ? 'true' : 'false', bg: on ? '#1E1E21' : 'transparent', sep: i === 0 ? 'transparent' : '#2A2A2E'
}));
const st = {
pending: { st: '승인 대기', stFg: '#E0443B', approve: 'inline-flex' },
ok: { st: '확정', stFg: '#F2F2F0', approve: 'none' },
group: { st: '단체 확인 중', stFg: '#A1A1A6', approve: 'none' }
};
const rows = [
['B31', '박지호', '1312', '카라멜 1 · 2,500원', 'pending', false],
['A12', '정민재', '3102', '오리지널 2 · 5,000원', 'pending', false],
['B05', '한지민', '1107', '콘소메 1 · 2,500원', 'pending', false],
['A03', '이서연', '2208', '팝콘 없음', 'ok', true],
['B17', '김도윤', '2104', '오리지널 1 · 2,500원', 'ok', false],
['B40', '윤시우', '교직원', '팝콘 없음', 'group', false]
].map(([seat, name, sid, pop, s, printed]) => ({ seat, name, sid, pop, ...st[s], unprint: printed ? 'inline-flex' : 'none', pr: printed ? '발권함' : '—', prFg: printed ? '#F2F2F0' : '#6E6E73' }));
const unbooked = ['최하은', '김도윤', 'ts250077@…', '이준서', '서하람'];
return { nav, stats, rows, unbooked };
}
}
</script>
</body>
</html>
