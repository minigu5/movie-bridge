<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>PC · 중강당</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F2F0}a:hover{color:#F2F2F0}
</style>
</helmet>
<div style="background: #0F0F10; color: #F2F2F0; font-family: 'Noto Sans KR', sans-serif; min-height: 1640px">
<header style="border-bottom: 1px solid #2A2A2E">
<div style="max-width: 1120px; margin: 0 auto; padding: 16px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<img src="/_blob/976905e12f405266a67d8c882838e311" alt="영화대교" style="width: 148px; height: auto; display: block">
<nav style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 14px; font-weight: 500">
<a href="#guide" style="text-decoration: none">이용 안내</a>
<button type="button" aria-label="프로필 메뉴" style="width: 34px; height: 34px; border-radius: 17px; background: #26262A; border: 1px solid #3A3A3F; padding: 0"></button>
</nav>
</div>
</header>
<main style="max-width: 1120px; margin: 0 auto; padding: 56px 40px 80px; display: flex; flex-direction: column; gap: 72px">
<section style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-end">
<div style="flex: 0 0 260px; height: 372px; background: #1A1A1C; border: 1px solid #2E2E32; display: flex; align-items: center; justify-content: center; color: #6E6E73; font-size: 14px">[포스터]</div>
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: 0.24em; color: #8E8E93">
<span style="display: block; width: 8px; height: 8px; border-radius: 4px; background: #E0443B"></span>
<span>이번 상영</span>
</div>
<a href="#past" style="font-size: 14px; color: #A1A1A6; text-decoration: none">‹ 지난 상영작</a>
</div>
<h1 style="margin: 0; font-size: 56px; line-height: 1.08; font-weight: 900; letter-spacing: -0.02em">[영화 제목]</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #F2F2F0">
<div style="padding: 14px 0; border-bottom: 1px solid #2A2A2E; display: flex; gap: 20px"><span style="width: 72px; color: #8E8E93; font-size: 13px">일시</span><span style="font-size: 15px; font-weight: 500">[날짜 · 시간]</span></div>
<div style="padding: 14px 0 14px 20px; border-bottom: 1px solid #2A2A2E; display: flex; gap: 20px"><span style="width: 72px; color: #8E8E93; font-size: 13px">장소</span><span style="font-size: 15px; font-weight: 500">중강당</span></div>
<div style="padding: 14px 0; border-bottom: 1px solid #2A2A2E; display: flex; gap: 20px"><span style="width: 72px; color: #8E8E93; font-size: 13px">관람 등급</span><span style="font-size: 15px; font-weight: 500">[등급]</span></div>
<div style="padding: 14px 0 14px 20px; border-bottom: 1px solid #2A2A2E; display: flex; gap: 20px"><span style="width: 72px; color: #8E8E93; font-size: 13px">예매 마감</span><span style="font-size: 15px; font-weight: 500">[마감 일시]</span></div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<a href="#seats" style="display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 32px; background: #F2F2F0; color: #0F0F10; font-size: 15px; font-weight: 700; text-decoration: none; letter-spacing: 0.04em">좌석 선택하기</a>
<span style="font-size: 14px; color: #8E8E93">남은 좌석 <b style="color: #F2F2F0">{{left}}</b>석</span>
</div>
</div>
</section>
<section id="seats" style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid #F2F2F0; padding-bottom: 14px">
<h2 style="margin: 0; font-size: 22px; font-weight: 900">좌석 선택</h2>
<div style="display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: #A1A1A6">
<span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 1px solid #4A4A50; border-radius: 5px 5px 2px 2px; background: #1A1A1C"></span>빈 좌석</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; border-radius: 5px 5px 2px 2px; background: #E0443B"></span>선택</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; border-radius: 5px 5px 2px 2px; background: #2A2A2E"></span>예매됨</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #F2F2F0; border-radius: 5px 5px 2px 2px; background: #1A1A1C"></span>동아리 전용</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="display: block; width: 16px; height: 16px; box-sizing: border-box; border: 1px dashed #8E8E93; border-radius: 5px 5px 2px 2px; background: #1A1A1C"></span>불편 좌석</span>
</div>
</div>
<div style="overflow-x: auto">
<div style="width: max-content; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0">
<div style="width: 70%; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 32px">
<span style="display: block; width: 100%; height: 3px; background: #F2F2F0; border-radius: 2px; box-shadow: 0 6px 24px rgba(242, 242, 240, 0.18)"></span>
<span style="font-size: 12px; letter-spacing: 0.6em; color: #8E8E93; margin-left: 0.6em">스크린</span>
</div>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="9">
<div style="display: flex; align-items: center; gap: 4px">
<sc-for list="{{row.seats}}" as="s" hint-placeholder-count="14">
<button type="button" aria-label="{{s.text}}" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 56px; padding: 0; box-sizing: border-box; border-radius: 12px 12px 6px 6px; background: {{s.bg}}; border: {{s.bd}}; color: {{s.fg}}; font: inherit; font-size: {{s.fs}}; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; margin-right: {{s.mr}}; visibility: {{s.vis}}">{{s.text}}</button>
</sc-for>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; border-top: 1px solid #2A2A2E; padding-top: 24px">
<div style="display: flex; align-items: baseline; gap: 16px">
<span style="font-size: 13px; color: #8E8E93">선택한 좌석</span>
<span style="font-size: 32px; font-weight: 900; letter-spacing: -0.02em">{{picked}}</span>
<span style="font-size: 14px; color: #A1A1A6">E열 · 오른쪽 구역</span>
</div>
<button type="button" style="height: 56px; padding: 0 56px; border: 0; background: #F2F2F0; color: #0F0F10; font: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.04em">예매하기</button>
</div>
</section>
</main>
<footer style="border-top: 1px solid #2A2A2E">
<div style="max-width: 1120px; margin: 0 auto; padding: 28px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: #8E8E93">
<img src="/_blob/976905e12f405266a67d8c882838e311" alt="영화대교" style="width: 88px; height: auto; display: block; opacity: 0.8">
<span>중강당 상영관</span>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1640}}'>
class Component extends DCLogic {
renderVals() {
const names = ['김도윤', '이서연', '박지호', '최하은', '정민재', '강예린', '윤시우', '장서아', '한지민', '오태윤'];
const theme = {
empty: { bg: '#1A1A1C', bd: '1px solid #4A4A50', fg: '#A1A1A6' },
booked: { bg: '#2A2A2E', bd: '1px solid #2A2A2E', fg: '#6E6E73' },
vip: { bg: '#1A1A1C', bd: '2px solid #F2F2F0', fg: '#F2F2F0' },
selected: { bg: '#E0443B', bd: '1px solid #E0443B', fg: '#FFFFFF' },
defect: { bg: '#1A1A1C', bd: '1px dashed #8E8E93', fg: '#8E8E93' }
};
let left = 0;
let n = 0;
const rows = 'ABCDEFGHI'.split('').map((label, r) => ({
label,
seats: Array.from({ length: 14 }, (_, c) => {
const block = c < 7 ? 'A' : 'B';
const num = r * 7 + (c % 7) + 1;
const missing = block === 'B' && num === 63;
const id = block + String(num).padStart(2, '0');
let kind = 'empty';
if (r <= 2 && c >= 4 && c <= 9) kind = 'vip';
if ((r * 5 + c * 3) % 7 === 0 && r > 0) kind = 'booked';
if (r === 4 && c === 9) kind = 'selected';
if (r === 6 && c === 1) kind = 'defect';
let text = id;
if (kind === 'booked') { text = names[n % names.length]; n += 1; }
if (!missing && kind !== 'booked') left += 1;
return { ...theme[kind], text, fs: kind === 'booked' ? '13px' : '15px', mr: c === 6 ? '44px' : '0px', vis: missing ? 'hidden' : 'visible' };
})
}));
return { rows, left, picked: 'B31' };
}
}
</script>
</body>
</html>
